server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html, so a new build shows up right away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build files can be cached long-term
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}